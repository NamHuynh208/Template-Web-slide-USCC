<script src="lib/dist/reveal.js"></script>
<script src="lib/plugin/markdown/markdown.js"></script>
<script src="lib/plugin/notes/notes.js"></script>
<script>
  Reveal.initialize({
    width: 1280,
    height: 720,
    margin: 0,
    center: false,
    hash: true,
    slideNumber: 'c/t',
    progress: true,
    transition: 'slide',
    controls: true,
    controlsLayout: 'edges',
    plugins: [RevealMarkdown, RevealNotes]
  }).then(function () {
    // Nền toàn màn hình cho các slide đặc biệt, lấy màu từ theme.css
    var css = getComputedStyle(document.documentElement);
    var v = function (n) { return css.getPropertyValue(n).trim(); };
    var dark = 'linear-gradient(135deg, ' + v('--c-dark') + ', ' + v('--c-dark-2') + ')';
    var bg = {
      cover: { gradient: dark },
      end: { gradient: dark },
      section: { color: v('--c-primary') },
      quote: { color: v('--c-primary-soft') }
    };
    document.querySelectorAll('.slides section').forEach(function (s) {
      Object.keys(bg).forEach(function (k) {
        if (s.classList.contains(k)) {
          if (bg[k].gradient) s.setAttribute('data-background-gradient', bg[k].gradient);
          if (bg[k].color) s.setAttribute('data-background-color', bg[k].color);
        }
      });
    });
    Reveal.sync();
  });
</script>
